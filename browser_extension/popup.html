<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
      color: #fafafa;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 14px;
    }
    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-badge.disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3f3f46;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #6366f1;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .hint {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.4;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Auto Timesheet Companion</h1>
  </div>

  <div id="statusBadge" class="status-badge disconnected">
    <div class="dot"></div>
    <span id="statusText">Checking desktop app...</span>
  </div>

  <div class="toggle-row">
    <span>Capture Web Activity</span>
    <label class="switch">
      <input type="checkbox" id="trackingToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <p class="hint">
    Captures visited websites, form fills, and outgoing emails on Gmail/Outlook Web. All data is saved locally on your machine for Gemma.
  </p>

  <script src="popup.js"></script>
</body>
</html>
